# Local dev only. These credentials are throwaway: never reuse them anywhere real.
services:
  db:
    image: pgvector/pgvector:pg16          # Postgres 16 with the pgvector extension built in
    environment:
      POSTGRES_USER: orderpal
      POSTGRES_PASSWORD: orderpal
      POSTGRES_DB: orderpal
    ports:
      - "5433:5432"                        # 5433 on your Mac so it won't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro   # runs once, on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderpal"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
